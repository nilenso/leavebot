{% extends "base.html" %}

{% block title %}Config - Leave Bot Admin{% endblock %}

{% block content %}
<div class="px-4 py-6 sm:px-0">
    <h1 class="text-2xl font-semibold text-gray-900 mb-6">Configuration</h1>

    <div class="bg-white shadow rounded-lg overflow-hidden">
        <table class="min-w-full divide-y divide-gray-200">
            <thead class="bg-gray-50">
                <tr>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Key</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Value</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Updated</th>
                </tr>
            </thead>
            <tbody class="bg-white divide-y divide-gray-200" id="config-table">
                <tr>
                    <td colspan="3" class="px-6 py-4 text-center text-gray-500">Loading...</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
async function loadConfig() {
    try {
        const res = await fetch('/api/config');
        const data = await res.json();
        const tbody = document.getElementById('config-table');
        tbody.innerHTML = data.map(cfg => `
            <tr>
                <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900 font-mono">${cfg.key}</td>
                <td class="px-6 py-4 text-sm text-gray-500 font-mono">${JSON.stringify(cfg.value)}</td>
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${cfg.updated_at ? new Date(cfg.updated_at).toLocaleString() : '-'}</td>
            </tr>
        `).join('') || '<tr><td colspan="3" class="px-6 py-4 text-center text-gray-500">No configuration found</td></tr>';
    } catch (e) {
        console.error('Failed to load config:', e);
    }
}

loadConfig();
</script>
{% endblock %}
