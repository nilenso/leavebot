{% extends "base.html" %}

{% block title %}Users - Leave Bot Admin{% endblock %}

{% block content %}
<div class="px-4 py-6 sm:px-0">
    <div class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-semibold text-gray-900">Users</h1>
        <div class="space-x-2">
            <button onclick="importSlack()" class="bg-purple-600 hover:bg-purple-700 text-white px-4 py-2 rounded-md text-sm font-medium">
                Import from Slack
            </button>
        </div>
    </div>

    <div class="bg-white shadow rounded-lg overflow-hidden">
        <table class="min-w-full divide-y divide-gray-200">
            <thead class="bg-gray-50">
                <tr>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Name</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Email</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Slack ID</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Harvest ID</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
                </tr>
            </thead>
            <tbody class="bg-white divide-y divide-gray-200" id="users-table">
                <tr>
                    <td colspan="5" class="px-6 py-4 text-center text-gray-500">Loading...</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
async function loadUsers() {
    try {
        const res = await fetch('/api/users?page_size=100');
        const data = await res.json();
        const tbody = document.getElementById('users-table');
        tbody.innerHTML = data.items.map(user => `
            <tr>
                <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">${user.slack_display_name}</td>
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${user.email || '-'}</td>
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500 font-mono">${user.slack_user_id}</td>
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${user.harvest_user_id || '-'}</td>
                <td class="px-6 py-4 whitespace-nowrap">
                    <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full ${user.is_active ? 'bg-green-100 text-green-800' : 'bg-gray-100 text-gray-800'}">
                        ${user.is_active ? 'Active' : 'Inactive'}
                    </span>
                </td>
            </tr>
        `).join('') || '<tr><td colspan="5" class="px-6 py-4 text-center text-gray-500">No users found</td></tr>';
    } catch (e) {
        console.error('Failed to load users:', e);
    }
}

async function importSlack() {
    if (!confirm('Import users from Slack and map Harvest IDs?')) return;
    try {
        const res = await fetch('/api/users/import/slack', { method: 'POST' });
        const data = await res.json();
        alert(`Imported ${data.imported} users, updated ${data.updated} users, mapped ${data.harvest_mapped} Harvest IDs`);
        loadUsers();
    } catch (e) {
        alert('Failed to import: ' + e.message);
    }
}

loadUsers();
</script>
{% endblock %}
