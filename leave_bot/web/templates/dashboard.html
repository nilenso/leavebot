{% extends "base.html" %}

{% block title %}Dashboard - Leave Bot Admin{% endblock %}

{% block content %}
<div class="px-4 py-6 sm:px-0">
    <h1 class="text-2xl font-semibold text-gray-900 mb-6">Dashboard</h1>

    <!-- Health Status -->
    <div class="bg-white overflow-hidden shadow rounded-lg mb-6">
        <div class="px-4 py-5 sm:p-6">
            <h2 class="text-lg font-medium text-gray-900 mb-4">System Health</h2>
            <div class="grid grid-cols-1 gap-4 sm:grid-cols-4" hx-get="/api/health" hx-trigger="load, every 30s" hx-swap="innerHTML">
                <div class="text-center p-4 bg-gray-50 rounded">
                    <div class="text-gray-500">Loading...</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Stats Cards -->
    <div class="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-4 mb-6">
        <div class="bg-white overflow-hidden shadow rounded-lg">
            <div class="p-5">
                <div class="flex items-center">
                    <div class="flex-shrink-0">
                        <span class="text-3xl">👥</span>
                    </div>
                    <div class="ml-5 w-0 flex-1">
                        <dl>
                            <dt class="text-sm font-medium text-gray-500 truncate">Active Users</dt>
                            <dd class="text-lg font-semibold text-gray-900" id="users-count">-</dd>
                        </dl>
                    </div>
                </div>
            </div>
        </div>

        <div class="bg-white overflow-hidden shadow rounded-lg">
            <div class="p-5">
                <div class="flex items-center">
                    <div class="flex-shrink-0">
                        <span class="text-3xl">📅</span>
                    </div>
                    <div class="ml-5 w-0 flex-1">
                        <dl>
                            <dt class="text-sm font-medium text-gray-500 truncate">Total Leaves</dt>
                            <dd class="text-lg font-semibold text-gray-900" id="leaves-count">-</dd>
                        </dl>
                    </div>
                </div>
            </div>
        </div>

        <div class="bg-white overflow-hidden shadow rounded-lg">
            <div class="p-5">
                <div class="flex items-center">
                    <div class="flex-shrink-0">
                        <span class="text-3xl">⏳</span>
                    </div>
                    <div class="ml-5 w-0 flex-1">
                        <dl>
                            <dt class="text-sm font-medium text-gray-500 truncate">Pending</dt>
                            <dd class="text-lg font-semibold text-gray-900" id="pending-count">-</dd>
                        </dl>
                    </div>
                </div>
            </div>
        </div>

        <div class="bg-white overflow-hidden shadow rounded-lg">
            <div class="p-5">
                <div class="flex items-center">
                    <div class="flex-shrink-0">
                        <span class="text-3xl">❌</span>
                    </div>
                    <div class="ml-5 w-0 flex-1">
                        <dl>
                            <dt class="text-sm font-medium text-gray-500 truncate">Failed</dt>
                            <dd class="text-lg font-semibold text-gray-900" id="failed-count">-</dd>
                        </dl>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Recent Leaves -->
    <div class="bg-white overflow-hidden shadow rounded-lg">
        <div class="px-4 py-5 sm:p-6">
            <h2 class="text-lg font-medium text-gray-900 mb-4">Recent Leaves</h2>
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">User</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Date</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Type</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
                        </tr>
                    </thead>
                    <tbody class="bg-white divide-y divide-gray-200" id="recent-leaves">
                        <tr>
                            <td colspan="4" class="px-6 py-4 text-center text-gray-500">Loading...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    // Fetch stats on page load
    async function loadStats() {
        try {
            const usersRes = await fetch('/api/users?page_size=1');
            const usersData = await usersRes.json();
            document.getElementById('users-count').textContent = usersData.total;

            const statsRes = await fetch('/api/leaves/stats/summary');
            const statsData = await statsRes.json();
            document.getElementById('leaves-count').textContent = statsData.total || 0;
            document.getElementById('pending-count').textContent = statsData.by_status?.pending || 0;
            document.getElementById('failed-count').textContent = statsData.by_status?.failed || 0;

            const leavesRes = await fetch('/api/leaves?page_size=10');
            const leavesData = await leavesRes.json();
            const tbody = document.getElementById('recent-leaves');
            tbody.innerHTML = leavesData.items.map(leave => `
                <tr>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${leave.user.slack_display_name}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${leave.date}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${leave.leave_type}</td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full ${
                            leave.status === 'completed' ? 'bg-green-100 text-green-800' :
                            leave.status === 'failed' ? 'bg-red-100 text-red-800' :
                            'bg-yellow-100 text-yellow-800'
                        }">
                            ${leave.status}
                        </span>
                    </td>
                </tr>
            `).join('') || '<tr><td colspan="4" class="px-6 py-4 text-center text-gray-500">No leaves found</td></tr>';
        } catch (e) {
            console.error('Failed to load stats:', e);
        }
    }
    loadStats();
</script>
{% endblock %}
