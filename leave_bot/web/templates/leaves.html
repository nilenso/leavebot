{% extends "base.html" %}

{% block title %}Leaves - Leave Bot Admin{% endblock %}

{% block content %}
<div class="px-4 py-6 sm:px-0">
    <h1 class="text-2xl font-semibold text-gray-900 mb-6">Leave Records</h1>

    <div class="bg-white shadow rounded-lg overflow-hidden">
        <table class="min-w-full divide-y divide-gray-200">
            <thead class="bg-gray-50">
                <tr>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">User</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Date</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Type</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Category</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                </tr>
            </thead>
            <tbody class="bg-white divide-y divide-gray-200" id="leaves-table">
                <tr>
                    <td colspan="6" class="px-6 py-4 text-center text-gray-500">Loading...</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
async function loadLeaves() {
    try {
        const res = await fetch('/api/leaves?page_size=50');
        const data = await res.json();
        const tbody = document.getElementById('leaves-table');
        tbody.innerHTML = data.items.map(leave => `
            <tr>
                <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">${leave.user?.slack_display_name || 'Unknown'}</td>
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${leave.date}</td>
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${leave.leave_type}</td>
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${leave.leave_category}</td>
                <td class="px-6 py-4 whitespace-nowrap">
                    <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full ${
                        leave.status === 'completed' ? 'bg-green-100 text-green-800' :
                        leave.status === 'failed' ? 'bg-red-100 text-red-800' :
                        leave.status === 'pending' ? 'bg-yellow-100 text-yellow-800' :
                        'bg-gray-100 text-gray-800'
                    }">
                        ${leave.status}
                    </span>
                </td>
                <td class="px-6 py-4 whitespace-nowrap text-sm">
                    ${leave.status === 'failed' ? `<button onclick="retryLeave(${leave.id})" class="text-blue-600 hover:text-blue-900">Retry</button>` : ''}
                </td>
            </tr>
        `).join('') || '<tr><td colspan="6" class="px-6 py-4 text-center text-gray-500">No leaves found</td></tr>';
    } catch (e) {
        console.error('Failed to load leaves:', e);
    }
}

async function retryLeave(id) {
    try {
        await fetch(`/api/leaves/${id}/retry`, { method: 'POST' });
        loadLeaves();
    } catch (e) {
        alert('Failed to retry: ' + e.message);
    }
}

loadLeaves();
</script>
{% endblock %}
