name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ============================================
  # CI Jobs - Run on all PRs and pushes to main
  # ============================================

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --frozen

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --frozen

      - name: Type check
        run: uv run ty check

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: leavebot
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: leavebot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U leavebot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        env:
          DATABASE_URL: postgresql://leavebot:testpassword@localhost:5432/leavebot_test
        run: uv run pytest --tb=short

  # ============================================
  # CD Jobs - Only run on push to main
  # ============================================

  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Generate .env file
        run: |
          cat > .env.production << 'EOF'
          # Database
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}

          # Slack
          SLACK_BOT_TOKEN=${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_APP_TOKEN=${{ secrets.SLACK_APP_TOKEN }}
          SLACK_SIGNING_SECRET=${{ secrets.SLACK_SIGNING_SECRET }}
          SLACK_CHANNEL_ID=${{ secrets.SLACK_CHANNEL_ID }}

          # OpenAI
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL=${{ secrets.OPENAI_MODEL }}

          # Google Calendar
          GOOGLE_SERVICE_ACCOUNT_JSON_BASE64=${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_BASE64 }}
          GOOGLE_CALENDAR_ID=${{ secrets.GOOGLE_CALENDAR_ID }}

          # Harvest
          HARVEST_ACCESS_TOKEN=${{ secrets.HARVEST_ACCESS_TOKEN }}
          HARVEST_ACCOUNT_ID=${{ secrets.HARVEST_ACCOUNT_ID }}
          HARVEST_PROJECT_ID=${{ secrets.HARVEST_PROJECT_ID }}
          HARVEST_VACATION_TASK_ID=${{ secrets.HARVEST_VACATION_TASK_ID }}
          HARVEST_SICK_TASK_ID=${{ secrets.HARVEST_SICK_TASK_ID }}

          # Google OAuth (Web Admin)
          GOOGLE_OAUTH_CLIENT_ID=${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET=${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          SESSION_SECRET_KEY=${{ secrets.SESSION_SECRET_KEY }}
          ALLOWED_EMAIL_DOMAIN=${{ secrets.ALLOWED_EMAIL_DOMAIN }}
          OAUTH_REDIRECT_URI=${{ secrets.OAUTH_REDIRECT_URI }}

          # Bot Configuration
          DEFAULT_TIMEZONE=Asia/Kolkata
          TRIGGER_KEYWORDS=leave,ooo,wfh,sick,vacation,pto,day off
          EOF

      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: ".env.production,docker-compose.prod.yml"
          target: "~/leave-bot"
          strip_components: 0

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_NAME: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: IMAGE_NAME
          script: |
            set -e
            cd ~/leave-bot

            # Use the generated .env file
            mv .env.production .env

            # Authenticate with GHCR (if repo is private)
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin || true

            # Pull latest image using production compose
            IMAGE_NAME=$IMAGE_NAME docker compose -f docker-compose.prod.yml pull

            # Restart services with new image
            IMAGE_NAME=$IMAGE_NAME docker compose -f docker-compose.prod.yml up -d

            # Wait for services to be healthy
            sleep 10

            # Run migrations
            IMAGE_NAME=$IMAGE_NAME docker compose -f docker-compose.prod.yml exec -T bot python -m alembic upgrade head

            # Cleanup old images
            docker image prune -f

            echo "✓ Deployment complete!"
