# Production docker-compose - uses pre-built images from GHCR
# Usage: IMAGE_NAME=ghcr.io/nilenso/leavebot:latest docker compose -f docker-compose.prod.yml up -d
#
# Requires: shared `web` network created by the gateway service
# See: https://github.com/nilenso/gateway

x-image: &app-image
  image: ${IMAGE_NAME:-ghcr.io/nilenso/leavebot:latest}

services:
  db:
    image: postgres:16-alpine
    container_name: leavebot-db
    environment:
      POSTGRES_USER: leavebot
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: leavebot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leavebot"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  bot:
    <<: *app-image
    container_name: leavebot-bot
    command: bot --json-logs
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://leavebot:${DB_PASSWORD}@db:5432/leavebot
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      disable: true  # Bot doesn't expose HTTP, disable Dockerfile healthcheck
    restart: unless-stopped

  web:
    <<: *app-image
    container_name: leavebot-web
    command: web --host 0.0.0.0 --port 8000
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://leavebot:${DB_PASSWORD}@db:5432/leavebot
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - default
      - web

networks:
  default:
    # Internal network for db connectivity
  web:
    external: true  # Created by gateway service

volumes:
  postgres_data:
