version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: leavebot-db
    environment:
      POSTGRES_USER: leavebot
      POSTGRES_PASSWORD: leavebot
      POSTGRES_DB: leavebot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leavebot"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  migrate:
    build: .
    container_name: leavebot-migrate
    command: migrate
    environment:
      DATABASE_URL: postgresql+asyncpg://leavebot:leavebot@db:5432/leavebot
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  bot:
    build: .
    container_name: leavebot-bot
    command: bot --json-logs
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://leavebot:leavebot@db:5432/leavebot
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build: .
    container_name: leavebot-web
    command: web --host 0.0.0.0 --port 8000
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://leavebot:leavebot@db:5432/leavebot
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: leavebot-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - ADMIN_PASSWORD_HASH=${ADMIN_PASSWORD_HASH:-}
    depends_on:
      - web
    restart: unless-stopped

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
