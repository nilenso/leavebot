[project]
name = "nilenso-leave-bot"
version = "0.1.0"
description = "Slack bot that monitors leave messages, parses them with LLM, and syncs to Google Calendar and Harvest"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Slack
    "slack-bolt>=1.18.0",
    "slack-sdk>=3.27.0",
    # Web
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "jinja2>=3.1.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.25",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    # LLM
    "openai>=1.10.0",
    # Google Calendar
    "google-auth>=2.27.0",
    "google-api-python-client>=2.116.0",
    # HTTP Client
    "httpx>=0.26.0",
    # Auth
    "authlib>=1.3.0",
    "itsdangerous>=2.1.0",  # Required by Starlette SessionMiddleware
    # Config & Utils
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.1.0",
    # CLI
    "typer>=0.9.0",
    "aiohttp>=3.13.2",
]

[project.scripts]
leave-bot = "leave_bot.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["leave_bot"]

# uv dependency groups (preferred over optional-dependencies for dev tooling)
[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "testcontainers[postgres]>=3.7.0",
    "httpx>=0.26.0",
    "ruff>=0.2.0",
    "ty>=0.0.1a7",
    "aiosqlite>=0.22.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["BLE001"]

# ty typechecker configuration
[tool.ty.environment]
python-version = "3.12"
